<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e3a8a">
    <title>Admin Login | Leuora Digital</title>
    <meta name="robots" content="noindex, nofollow">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { leuoraBlue: '#1e3a8a', leuoraYellow: '#facc15' } } } }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .admin-view { display: none; }
        .admin-view.active { display: block; animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal { display: none; }
        .modal.active { display: flex; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 h-screen overflow-hidden">

    <div id="loginScreen" class="fixed inset-0 bg-leuoraBlue z-[100] flex flex-col items-center justify-center p-4">
        <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md text-center">
            <img src="images/logo.png" alt="Leuora" class="w-20 h-20 mx-auto mb-4" onerror="this.style.display='none'">
            <h1 class="text-2xl font-bold text-leuoraBlue mb-2">Admin Portal</h1>
            <p class="text-gray-500 text-sm mb-6">Restricted Access Only</p>
            <div id="loginError" class="hidden bg-red-100 text-red-700 p-3 rounded-lg mb-4 text-sm"></div>
            <form id="adminLoginForm">
                <div class="relative mb-4"><i class="fa-regular fa-envelope absolute left-4 top-4 text-gray-400"></i><input type="email" id="adminEmail" placeholder="Admin Email" class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-leuoraBlue" required></div>
                <div class="relative mb-6"><i class="fa-solid fa-lock absolute left-4 top-4 text-gray-400"></i><input type="password" id="adminPassword" placeholder="Password" class="w-full pl-11 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-leuoraBlue" required></div>
                <button type="submit" id="loginBtn" class="w-full bg-leuoraBlue text-white font-bold py-3 rounded-xl hover:bg-blue-900 transition shadow-lg"><span id="loginBtnText">Login to Dashboard</span><i id="loginSpinner" class="hidden fa-solid fa-circle-notch fa-spin ml-2"></i></button>
            </form>
            <a href="index.html" class="block mt-6 text-sm text-gray-400 hover:text-leuoraBlue">← Back to Store</a>
        </div>
    </div>

    <div id="adminDashboard" class="hidden h-full flex overflow-hidden">
        <aside class="w-20 md:w-64 bg-leuoraBlue text-white flex flex-col h-full flex-shrink-0 transition-all duration-300 z-50">
            <div class="p-4 md:p-6 flex items-center justify-center md:justify-start border-b border-blue-800"><img src="images/logo.png" class="w-10 h-10 md:mr-3" onerror="this.src='https://placehold.co/50x50?text=L'"><h1 class="hidden md:block font-bold text-xl">Admin Panel</h1></div>
            <nav class="flex-1 py-4 space-y-2">
                <button onclick="switchView('view-overview')" class="w-full flex items-center px-4 md:px-6 py-3 hover:bg-blue-800 transition text-left bg-blue-800 font-bold" id="nav-overview"><i class="fa-solid fa-chart-pie w-8 text-center text-xl"></i> <span class="hidden md:inline ml-2">Overview</span></button>
                <button onclick="switchView('view-orders')" class="w-full flex items-center px-4 md:px-6 py-3 hover:bg-blue-800 transition text-left" id="nav-orders"><i class="fa-solid fa-box w-8 text-center text-xl"></i> <span class="hidden md:inline ml-2">Orders</span></button>
                <button onclick="switchView('view-products')" class="w-full flex items-center px-4 md:px-6 py-3 hover:bg-blue-800 transition text-left" id="nav-products"><i class="fa-solid fa-tags w-8 text-center text-xl"></i> <span class="hidden md:inline ml-2">Products</span></button>
                <button onclick="switchView('view-suppliers')" class="w-full flex items-center px-4 md:px-6 py-3 hover:bg-blue-800 transition text-left" id="nav-suppliers"><i class="fa-solid fa-store w-8 text-center text-xl"></i> <span class="hidden md:inline ml-2">Suppliers</span></button>
                <button onclick="switchView('view-settings')" class="w-full flex items-center px-4 md:px-6 py-3 hover:bg-blue-800 transition text-left" id="nav-settings"><i class="fa-solid fa-gear w-8 text-center text-xl"></i> <span class="hidden md:inline ml-2">Settings</span></button>
            </nav>
            <div class="p-4 border-t border-blue-800"><button onclick="logout()" class="w-full flex items-center justify-center bg-red-500 hover:bg-red-600 py-2 rounded-lg transition"><i class="fa-solid fa-arrow-right-from-bracket md:mr-2"></i> <span class="hidden md:inline">Logout</span></button></div>
        </aside>

        <main class="flex-1 h-full overflow-y-auto relative">
            <div class="md:hidden bg-white p-4 shadow-sm flex items-center justify-between sticky top-0 z-40"><h1 class="font-bold text-leuoraBlue">Leuora Admin</h1><img src="images/logo.png" class="w-8 h-8" onerror="this.style.display='none'"></div>

            <section id="view-overview" class="admin-view active p-4 md:p-8">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Dashboard Overview</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center"><div class="w-14 h-14 rounded-full bg-blue-100 text-leuoraBlue flex items-center justify-center text-2xl mr-4"><i class="fa-solid fa-naira-sign"></i></div><div><p class="text-gray-500 text-sm">Total Revenue</p><h3 class="text-2xl font-bold text-gray-800" id="statRevenue">₦0</h3></div></div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center"><div class="w-14 h-14 rounded-full bg-yellow-100 text-yellow-600 flex items-center justify-center text-2xl mr-4"><i class="fa-solid fa-clock"></i></div><div><p class="text-gray-500 text-sm">Pending Orders</p><h3 class="text-2xl font-bold text-gray-800" id="statPendingOrders">0</h3></div></div>
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex items-center"><div class="w-14 h-14 rounded-full bg-green-100 text-green-600 flex items-center justify-center text-2xl mr-4"><i class="fa-solid fa-users"></i></div><div><p class="text-gray-500 text-sm">Total Suppliers</p><h3 class="text-2xl font-bold text-gray-800" id="statSuppliers">0</h3></div></div>
                </div>
            </section>

            <section id="view-orders" class="admin-view p-4 md:p-8">
                <div class="flex justify-between items-center mb-6"><h2 class="text-2xl font-bold text-gray-800">Order Management</h2><button onclick="loadOrders()" class="text-leuoraBlue text-sm font-semibold"><i class="fa-solid fa-rotate-right mr-1"></i> Refresh</button></div>
                <div id="ordersContainer" class="space-y-4"></div>
            </section>

            <section id="view-products" class="admin-view p-4 md:p-8">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Product Management</h2>
                <div class="flex space-x-4 mb-6 border-b border-gray-200 pb-2 overflow-x-auto hide-scrollbar">
                    <button onclick="switchProductTab('pending')" id="tab-pending" class="font-bold text-leuoraBlue border-b-2 border-leuoraBlue pb-2 whitespace-nowrap">Pending Approvals</button>
                    <button onclick="switchProductTab('all')" id="tab-all" class="font-bold text-gray-400 pb-2 whitespace-nowrap">All Products</button>
                    <button onclick="switchProductTab('price-requests')" id="tab-price" class="font-bold text-gray-400 pb-2 whitespace-nowrap">Price Requests</button>
                </div>
                <div id="pendingProductsContainer" class="space-y-4"></div>
                <div id="allProductsContainer" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
                <div id="priceRequestsContainer" class="hidden space-y-4"></div>
            </section>

            <section id="view-suppliers" class="admin-view p-4 md:p-8">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Supplier Management</h2>
                <div id="suppliersContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            </section>

            <section id="view-settings" class="admin-view p-4 md:p-8">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">App Settings</h2>
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 max-w-2xl">
                    <label class="block text-sm font-bold text-gray-700 mb-2">Announcement Bar Text</label>
                    <textarea id="announcementInput" rows="3" class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-leuoraBlue mb-4"></textarea>
                    <button onclick="updateAnnouncement()" class="bg-leuoraBlue text-white font-bold py-2 px-6 rounded-xl hover:bg-blue-900 transition">Save Announcement</button>
                </div>
            </section>
        </main>
    </div>

    <div id="rejectModal" class="modal fixed inset-0 bg-black bg-opacity-50 z-50 items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md"><h3 class="text-xl font-bold text-gray-800 mb-4">Reject Product</h3><textarea id="rejectReason" rows="3" class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-red-500 mb-4" placeholder="Reason for rejection..."></textarea><div class="flex justify-end space-x-3"><button onclick="closeModal('rejectModal')" class="px-4 py-2 text-gray-600 font-bold hover:bg-gray-100 rounded-lg">Cancel</button><button id="confirmRejectBtn" class="px-4 py-2 bg-red-600 text-white font-bold rounded-lg hover:bg-red-700">Confirm Reject</button></div></div>
    </div>

    <div id="priceModal" class="modal fixed inset-0 bg-black bg-opacity-50 z-50 items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md"><h3 class="text-xl font-bold text-gray-800 mb-2">Set Final Selling Price</h3><div class="mb-4"><label class="block text-sm font-bold text-gray-700 mb-1">Supplier Price</label><input type="text" id="modalSupplierPrice" class="w-full bg-gray-100 border border-gray-300 rounded-xl p-3 text-gray-600" readonly></div><div class="mb-6"><label class="block text-sm font-bold text-gray-700 mb-1">Your Admin Price (₦)</label><input type="number" id="modalAdminPrice" class="w-full border border-gray-300 rounded-xl p-3 focus:outline-none focus:ring-2 focus:ring-leuoraBlue" placeholder="e.g. 1500"></div><div class="flex justify-end space-x-3"><button onclick="closeModal('priceModal')" class="px-4 py-2 text-gray-600 font-bold hover:bg-gray-100 rounded-lg">Cancel</button><button id="confirmPriceBtn" class="px-4 py-2 bg-leuoraBlue text-white font-bold rounded-lg hover:bg-blue-900">Approve</button></div></div>
    </div>

    <script>
        // FIXED: Renamed to leuoraDb
        const supabaseUrl = 'https://rmlgvsvvbwoudrosbbpd.supabase.co';
        const supabaseKey = 'sb_publishable_EaVd_ShfJE4L5FKkrXQThA_c56igAp7';
        const leuoraDb = supabase.createClient(supabaseUrl, supabaseKey);
        
        const ADMIN_EMAIL = 'leuoradigital@leuora.xyz';

        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            const errorDiv = document.getElementById('loginError');
            const btnText = document.getElementById('loginBtnText');
            const spinner = document.getElementById('loginSpinner');
            
            errorDiv.classList.add('hidden'); btnText.classList.add('hidden'); spinner.classList.remove('hidden');

            if (email !== ADMIN_EMAIL) {
                errorDiv.innerText = "Unauthorized email address."; errorDiv.classList.remove('hidden'); btnText.classList.remove('hidden'); spinner.classList.add('hidden'); return;
            }

            const { data, error } = await leuoraDb.auth.signInWithPassword({ email, password });
            if (error) {
                errorDiv.innerText = error.message; errorDiv.classList.remove('hidden'); btnText.classList.remove('hidden'); spinner.classList.add('hidden');
            } else {
                document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('adminDashboard').classList.remove('hidden'); loadOverview();
            }
        });

        async function checkSession() {
            const { data: { session } } = await leuoraDb.auth.getSession();
            if (session && session.user.email === ADMIN_EMAIL) {
                document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('adminDashboard').classList.remove('hidden'); loadOverview();
            }
        }

        async function logout() { await leuoraDb.auth.signOut(); window.location.reload(); }

        function switchView(viewId) {
            document.querySelectorAll('.admin-view').forEach(view => view.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            document.querySelectorAll('aside nav button').forEach(btn => btn.classList.remove('bg-blue-800', 'font-bold'));
            const activeNav = document.querySelector(`aside nav button[onclick="switchView('${viewId}')"]`);
            if(activeNav) activeNav.classList.add('bg-blue-800', 'font-bold');
            if (viewId === 'view-orders') loadOrders();
            if (viewId === 'view-products') loadProducts();
            if (viewId === 'view-suppliers') loadSuppliers();
            if (viewId === 'view-settings') loadSettings();
        }

        async function loadOverview() {
            const { data: orders } = await leuoraDb.from('orders').select('total_amount, status');
            if (orders) {
                const revenue = orders.filter(o => o.status === 'delivered' || o.payment_status === 'paid').reduce((sum, o) => sum + Number(o.total_amount), 0);
                document.getElementById('statRevenue').innerText = '₦' + revenue.toLocaleString();
                document.getElementById('statPendingOrders').innerText = orders.filter(o => o.status === 'pending').length;
            }
            const { count } = await leuoraDb.from('suppliers').select('*', { count: 'exact', head: true });
            document.getElementById('statSuppliers').innerText = count || 0;
        }

        async function loadOrders() {
            const container = document.getElementById('ordersContainer');
            container.innerHTML = '<p class="text-gray-500"><i class="fa-solid fa-spinner fa-spin"></i> Loading orders...</p>';
            const { data: orders, error } = await leuoraDb.from('orders').select(`*, profiles:buyer_id ( full_name, phone_number ), order_items ( quantity, price_at_purchase, supplier_price_at_purchase, products ( title, category ), suppliers ( business_name, whatsapp_number ) )`).order('created_at', { ascending: false });

            if (error || !orders || orders.length === 0) { container.innerHTML = '<p class="text-gray-500 bg-white p-6 rounded-xl">No orders found.</p>'; return; }

            container.innerHTML = orders.map(order => {
                const customerName = order.profiles?.full_name || 'Student';
                const customerPhone = order.profiles?.phone_number || 'No Phone';
                
                const supplierGroups = {};
                order.order_items.forEach(item => {
                    const supId = item.suppliers?.business_name || 'Unknown';
                    if (!supplierGroups[supId]) supplierGroups[supId] = { whatsapp: item.suppliers?.whatsapp_number || '', items: [] };
                    supplierGroups[supId].items.push(item);
                });

                let whatsappBtns = '';
                for (const [supName, group] of Object.entries(supplierGroups)) {
                    let msg = `Hello ${supName}, you have a new order on Leuora!%0A%0AOrder ID: ${order.id.substring(0,8)}%0AStudent: ${customerName}%0AStudent Phone: ${customerPhone}%0APickup Location: ${order.pickup_location}%0A%0AItems to prepare:%0A`;
                    group.items.forEach(i => { msg += `- ${i.quantity}x ${i.products?.title} (Supplier Price: ₦${i.supplier_price_at_purchase})%0A`; });
                    const cleanNumber = group.whatsapp.replace(/\D/g, '');
                    whatsappBtns += `<a href="https://wa.me/${cleanNumber}?text=${msg}" target="_blank" class="bg-green-500 text-white text-xs font-bold py-2 px-3 rounded-lg mt-2 inline-block hover:bg-green-600 transition"><i class="fa-brands fa-whatsapp mr-1"></i> Contact ${supName}</a> `;
                }

                let statusColor = 'bg-gray-100 text-gray-800';
                if (order.status === 'pending') statusColor = 'bg-yellow-100 text-yellow-800';
                if (order.status === 'shipped') statusColor = 'bg-blue-100 text-blue-800';
                if (order.status === 'delivered') statusColor = 'bg-green-100 text-green-800';
                if (order.status === 'cancelled') statusColor = 'bg-red-100 text-red-800';

                return `<div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 mb-4"><div class="flex justify-between items-start mb-3"><div><h4 class="font-bold text-gray-800">Order #${order.id.substring(0,8)}</h4><p class="text-xs text-gray-500">${new Date(order.created_at).toLocaleString()}</p><p class="text-sm text-gray-700 mt-1"><i class="fa-regular fa-user mr-1"></i> ${customerName} (${customerPhone})</p></div><div class="text-right"><span class="px-3 py-1 rounded-full text-xs font-bold ${statusColor}">${order.status.toUpperCase()}</span><p class="font-bold text-leuoraBlue mt-2">₦${Number(order.total_amount).toLocaleString()}</p></div></div><div class="bg-gray-50 p-3 rounded-xl text-sm mb-3"><p class="font-semibold mb-1">Pickup: ${order.pickup_location}</p><p class="text-xs text-gray-500">Payment: ${order.payment_method.toUpperCase()} (${order.payment_status})</p></div><div class="flex flex-wrap gap-2 items-center"><select onchange="updateOrderStatus('${order.id}', this.value)" class="bg-white border border-gray-300 text-sm rounded-lg p-2 focus:ring-leuoraBlue"><option value="pending" ${order.status === 'pending' ? 'selected' : ''}>Pending</option><option value="shipped" ${order.status === 'shipped' ? 'selected' : ''}>Shipped (Packed)</option><option value="on_the_way" ${order.status === 'on_the_way' ? 'selected' : ''}>On the way</option><option value="ready_for_pickup" ${order.status === 'ready_for_pickup' ? 'selected' : ''}>Ready for pickup</option><option value="delivered" ${order.status === 'delivered' ? 'selected' : ''}>Delivered</option></select>${whatsappBtns}</div></div>`;
            }).join('');
        }

        async function updateOrderStatus(orderId, newStatus) {
            const { error } = await leuoraDb.from('orders').update({ status: newStatus }).eq('id', orderId);
            if (error) alert("Error updating status: " + error.message);
        }

        let productToProcess = null;

        function switchProductTab(tab) {
            document.getElementById('pendingProductsContainer').classList.add('hidden');
            document.getElementById('allProductsContainer').classList.add('hidden');
            document.getElementById('priceRequestsContainer').classList.add('hidden');
            document.getElementById('tab-pending').className = "font-bold text-gray-400 pb-2 whitespace-nowrap";
            document.getElementById('tab-all').className = "font-bold text-gray-400 pb-2 whitespace-nowrap";
            document.getElementById('tab-price').className = "font-bold text-gray-400 pb-2 whitespace-nowrap";

            if (tab === 'pending') { document.getElementById('pendingProductsContainer').classList.remove('hidden'); document.getElementById('tab-pending').className = "font-bold text-leuoraBlue border-b-2 border-leuoraBlue pb-2 whitespace-nowrap"; }
            else if (tab === 'all') { document.getElementById('allProductsContainer').classList.remove('hidden'); document.getElementById('tab-all').className = "font-bold text-leuoraBlue border-b-2 border-leuoraBlue pb-2 whitespace-nowrap"; }
            else { document.getElementById('priceRequestsContainer').classList.remove('hidden'); document.getElementById('tab-price').className = "font-bold text-leuoraBlue border-b-2 border-leuoraBlue pb-2 whitespace-nowrap"; }
            loadProducts();
        }

        async function loadProducts() {
            const { data: products, error } = await leuoraDb.from('products').select(`*, suppliers ( business_name )`).order('created_at', { ascending: false });
            if (error) return console.error(error);

            const pending = products.filter(p => p.status === 'pending');
            const approved = products.filter(p => p.status === 'approved');
            const pendingContainer = document.getElementById('pendingProductsContainer');
            
            if (pending.length === 0) pendingContainer.innerHTML = '<p class="text-gray-500 bg-white p-6 rounded-xl">No pending products to review.</p>';
            else {
                pendingContainer.innerHTML = pending.map(p => `<div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col md:flex-row gap-4 mb-4"><img src="${p.image_url}" class="w-full md:w-32 h-32 object-cover rounded-xl" onerror="this.src='https://placehold.co/150x150'"><div class="flex-1"><h4 class="font-bold text-gray-800 text-lg">${p.title}</h4><p class="text-sm text-gray-500">Category: ${p.category} | Supplier: ${p.suppliers?.business_name || 'Unknown'}</p><p class="text-sm text-gray-600 mt-2 line-clamp-2">${p.description || 'No description'}</p><div class="mt-4 flex space-x-2 justify-end"><button onclick="openRejectModal('${p.id}')" class="bg-red-50 text-red-600 px-4 py-2 rounded-lg font-bold text-sm hover:bg-red-100">Reject</button><button onclick="openPriceModal('${p.id}', ${p.supplier_price}, 'approve')" class="bg-leuoraBlue text-white px-4 py-2 rounded-lg font-bold text-sm hover:bg-blue-900">Set Price & Approve</button></div></div></div>`).join('');
            }

            const allContainer = document.getElementById('allProductsContainer');
            if (approved.length === 0) allContainer.innerHTML = '<p class="text-gray-500 col-span-3">No approved products yet.</p>';
            else {
                allContainer.innerHTML = approved.map(p => `<div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden"><img src="${p.image_url}" class="w-full h-40 object-cover" onerror="this.src='https://placehold.co/400x200'"><div class="p-4"><h4 class="font-bold text-gray-800 truncate">${p.title}</h4><p class="text-leuoraBlue font-bold">₦${Number(p.admin_price).toLocaleString()}</p><div class="flex space-x-2 mt-3"><button onclick="toggleTag('${p.id}', 'is_trending', ${p.is_trending})" class="flex-1 text-xs font-bold py-2 rounded-lg transition ${p.is_trending ? 'bg-leuoraBlue text-white' : 'bg-gray-100 text-gray-600'}">Trending</button><button onclick="toggleTag('${p.id}', 'is_flash_deal', ${p.is_flash_deal})" class="flex-1 text-xs font-bold py-2 rounded-lg transition ${p.is_flash_deal ? 'bg-orange-500 text-white' : 'bg-gray-100 text-gray-600'}">Flash Sale</button></div></div></div>`).join('');
            }

            const { data: requests } = await leuoraDb.from('price_change_requests').select(`*, products(title, supplier_price, suppliers(business_name))`).eq('status', 'pending');
            const reqContainer = document.getElementById('priceRequestsContainer');
            if (requests && requests.length > 0) {
                reqContainer.innerHTML = requests.map(r => `<div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 mb-4"><h4 class="font-bold text-gray-800">${r.products?.title}</h4><p class="text-sm text-gray-500">Supplier: ${r.products?.suppliers?.business_name}</p><p class="text-sm mt-2"><b>Reason:</b> ${r.reason}</p><p class="text-sm mt-1"><b>Old Price:</b> ₦${r.products?.supplier_price} ➔ <b>New Request:</b> <span class="text-leuoraBlue font-bold">₦${r.requested_price}</span></p><div class="mt-4 flex space-x-2 justify-end"><button onclick="rejectPriceRequest('${r.id}')" class="bg-red-50 text-red-600 px-4 py-2 rounded-lg font-bold text-sm hover:bg-red-100">Reject</button><button onclick="openPriceModal('${r.product_id}', ${r.requested_price}, 'price_req', '${r.id}')" class="bg-leuoraBlue text-white px-4 py-2 rounded-lg font-bold text-sm hover:bg-blue-900">Approve New Price</button></div></div>`).join('');
            } else {
                reqContainer.innerHTML = '<p class="text-gray-500 bg-white p-6 rounded-xl">No pending price requests.</p>';
            }
        }

        async function toggleTag(productId, field, currentValue) {
            const { error } = await leuoraDb.from('products').update({ [field]: !currentValue }).eq('id', productId);
            if (!error) loadProducts();
        }

        function openRejectModal(productId) {
            productToProcess = productId;
            document.getElementById('rejectReason').value = '';
            document.getElementById('rejectModal').classList.add('active');
            document.getElementById('confirmRejectBtn').onclick = async () => {
                const reason = document.getElementById('rejectReason').value;
                if(!reason) return alert("Please enter a reason.");
                await leuoraDb.from('products').update({ status: 'rejected', rejection_reason: reason }).eq('id', productId);
                closeModal('rejectModal'); loadProducts();
            };
        }

        function openPriceModal(productId, supplierPrice, actionType, requestId = null) {
            productToProcess = productId;
            document.getElementById('modalSupplierPrice').value = '₦' + Number(supplierPrice).toLocaleString();
            document.getElementById('modalAdminPrice').value = '';
            document.getElementById('priceModal').classList.add('active');
            document.getElementById('confirmPriceBtn').onclick = async () => {
                const adminPrice = document.getElementById('modalAdminPrice').value;
                if(!adminPrice) return alert("Please enter your selling price.");
                if (actionType === 'approve') await leuoraDb.from('products').update({ status: 'approved', admin_price: adminPrice, supplier_price: supplierPrice }).eq('id', productId);
                else if (actionType === 'price_req') {
                    await leuoraDb.from('products').update({ supplier_price: supplierPrice, admin_price: adminPrice }).eq('id', productId);
                    await leuoraDb.from('price_change_requests').update({ status: 'approved' }).eq('id', requestId);
                }
                closeModal('priceModal'); loadProducts();
            };
        }

        function closeModal(modalId) { document.getElementById(modalId).classList.remove('active'); }
        async function rejectPriceRequest(requestId) { await leuoraDb.from('price_change_requests').update({ status: 'rejected', admin_reason: 'Rejected by Admin' }).eq('id', requestId); loadProducts(); }

        async function loadSuppliers() {
            const container = document.getElementById('suppliersContainer');
            const { data: suppliers, error } = await leuoraDb.from('suppliers').select('*');
            if (error || !suppliers || suppliers.length === 0) { container.innerHTML = '<p class="text-gray-500">No suppliers registered yet.</p>'; return; }
            const categoriesList = ['Food stuff', 'Snacks', 'Frozen food', 'Cake', 'Clothing', 'Fashion', 'Skincare', 'Content creation', 'Phone repair', 'Transport', 'Gift vendor'];

            container.innerHTML = suppliers.map(s => {
                const currentCats = s.categories || [];
                const checkboxes = categoriesList.map(cat => `<label class="flex items-center space-x-2 text-sm mt-1"><input type="checkbox" value="${cat}" ${currentCats.includes(cat) ? 'checked' : ''} onchange="updateSupplierCategories('${s.id}', this)"><span>${cat}</span></label>`).join('');
                return `<div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100"><h4 class="font-bold text-lg text-gray-800">${s.business_name}</h4><p class="text-sm text-gray-500 mb-2"><i class="fa-brands fa-whatsapp text-green-500 mr-1"></i> ${s.whatsapp_number}</p><p class="text-xs text-gray-500 mb-4">Bank: ${s.bank_name} | Acc: ${s.account_number}</p><div class="border-t pt-3"><p class="font-bold text-sm text-gray-700 mb-2">Allowed Categories:</p><div class="grid grid-cols-2 gap-1">${checkboxes}</div></div></div>`;
            }).join('');
        }

        async function updateSupplierCategories(supplierId, checkbox) {
            const container = checkbox.closest('.grid');
            const checkedBoxes = Array.from(container.querySelectorAll('input:checked')).map(cb => cb.value);
            const { error } = await leuoraDb.from('suppliers').update({ categories: checkedBoxes }).eq('id', supplierId);
            if (error) alert("Error updating categories");
        }

        async function loadSettings() {
            const { data } = await leuoraDb.from('settings').select('announcement_text').eq('id', 1).single();
            if (data) document.getElementById('announcementInput').value = data.announcement_text;
        }

        async function updateAnnouncement() {
            const text = document.getElementById('announcementInput').value;
            const { error } = await leuoraDb.from('settings').update({ announcement_text: text }).eq('id', 1);
            if (error) alert("Error saving announcement."); else alert("Announcement updated successfully!");
        }

        document.addEventListener('DOMContentLoaded', checkSession);
    </script>
</body>
</html>
