<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leuora Digital - Offline</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
</head>
<body class="bg-gray-900 text-white flex items-center justify-center h-screen p-4">
    <div class="text-center max-w-md">
        <img src="images/logo.png" alt="Leuora Digital Logo" class="w-24 h-24 mx-auto mb-6 opacity-50">
        <h1 class="text-3xl font-bold mb-2">You are Offline</h1>
        <p class="text-gray-400 mb-8">It looks like you've lost your internet connection. Please check your network and try again.</p>
        <button onclick="window.location.reload()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-full transition duration-300">
            Retry Connection
        </button>
    </div>
</body>
</html>
